services:
  web:
    image: first-app:latest
    container_name: first-app
    build:
      context: .
    ports:
      - "5005:5005"
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: first-redis
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    ports:
      - "5006:5006"

volumes:
  redis-data: